; BrewDial firmware. One env per board/role; each board's wiring lives in boards/<name>/.
;
;   pio run -e crowpanel21 -t upload -t monitor
;
; Libraries live in lib/ (see CLAUDE.md for the layering rules); each env lists the ones it uses
; by the name in their library.json (brewdial-*). tools/check_rules.py runs before every build and
; fails it if a layering or wire-format rule is broken.

[platformio]
src_dir = boards
default_envs = crowpanel21
; pioarduino (needed for Arduino-ESP32 3.x) replaces PlatformIO Core in its core dir's
; Python env with its own fork. Keep it in a separate core dir so the global
; ~/.platformio install, and your other projects, are left alone.
core_dir = ~/.platformio-pioarduino

; ---------------------------------------------------------------- shared settings
[env]
; Arduino-ESP32 3.3.11 (ESP-IDF 5.5). Newer pioarduino releases need PlatformIO Core >= 6.2.
; Arduino is only the host here: all drivers use ESP-IDF APIs directly.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = pre:tools/check_rules.py
lib_ldf_mode = chain
; lib/drivers/* and lib/fonts/* sit one level deeper than PlatformIO looks by itself. The two
; grouping folders aren't libraries, so they're ignored as such.
lib_extra_dirs = lib/drivers, lib/fonts
lib_ignore = drivers, fonts
build_unflags = -Os
build_flags =
    -O2                     ; LVGL's software renderer is noticeably faster than at -Os
    -DCORE_DEBUG_LEVEL=3    ; ESP_LOGI output on the serial monitor
    -DLV_CONF_INCLUDE_SIMPLE
    -Iconfig

; ESP32-S3 with 16 MB flash + 8 MB octal PSRAM (CrowPanel 2.1", Waveshare knob 1.8")
[s3_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- boards

; Elecrow CrowPanel 2.1" (480x480): display + controller on one board.
[env:crowpanel21]
extends = s3_n16r8
build_src_filter = +<crowpanel21/>
build_flags =
    ${s3_n16r8.build_flags}
    -DBREW_UI_DISP_SIZE=480
lib_deps =
    lvgl/lvgl@9.3.0
    brewdial-driver-interfaces
    brewdial-core
    brewdial-ui
    brewdial-fonts-480
    brewdial-app
    brewdial-network
    brewdial-drivers-chips
    brewdial-drivers-esp32

; The same with a simulated fermenter instead of the probe (the dial says DEMO).
[env:crowpanel21_demo]
extends = env:crowpanel21
build_flags =
    ${env:crowpanel21.build_flags}
    -DBREW_DEMO=1

; CrowPanel as a display only; the controller runs on another board (env controller_devkit),
; linked over UART.
[env:crowpanel21_display]
extends = env:crowpanel21
build_flags =
    ${env:crowpanel21.build_flags}
    -DBREW_ROLE_DISPLAY=1

; Headless controller (any ESP32-S3 dev board): probe + relays, talks to a display over UART.
[env:controller_devkit]
board = esp32-s3-devkitc-1
build_src_filter = +<controller_devkit/>
lib_deps =
    brewdial-driver-interfaces
    brewdial-core
    brewdial-drivers-esp32

; The same with a simulated fermenter instead of the probe.
[env:controller_devkit_demo]
extends = env:controller_devkit
build_flags =
    ${env.build_flags}
    -DBREW_DEMO=1

; Waveshare ESP32-S3 Knob Touch LCD 1.8" (360x360 ST77916 QSPI). UNVERIFIED: pins and the
; panel init sequence are TODO in boards/waveshare_knob18/board_config.h.
[env:waveshare_knob18]
extends = s3_n16r8
build_src_filter = +<waveshare_knob18/>
build_flags =
    ${s3_n16r8.build_flags}
    -DBREW_UI_DISP_SIZE=360
lib_deps =
    lvgl/lvgl@9.3.0
    brewdial-driver-interfaces
    brewdial-core
    brewdial-ui
    brewdial-fonts-360
    brewdial-app
    brewdial-network
    brewdial-drivers-chips
    brewdial-drivers-esp32
