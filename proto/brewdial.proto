// BrewDial board-to-board messages: the SCHEMA OF RECORD.
//
// Not compiled yet. Wire format v1 is hand-written (lib/core/src/wire_v1.h) and must keep
// the same field numbers and names as this file; tools/check_rules.py fails the build if the two
// drift apart. Moving to nanopb = generate from this file, encode as proto_ver 2 in codec.cpp.
//
// Every frame: [proto_ver:u8][msg_type:u8][seq:u16 LE][payload]. Temperatures are
// centi-degrees Celsius (sint32 here, i16 on the v1 wire).
//
// Evolution: add fields with NEW numbers only; never renumber, retype or reuse a number.
syntax = "proto3";

package brewdial;

// msg_type 1, controller -> display. Latest value wins.
message State {
  sint32 temp_cc = 1;
  sint32 setpoint_ferm_cc = 2;
  sint32 setpoint_crash_cc = 3;
  uint32 mode = 4;      // 0 ferment, 1 crash
  uint32 action = 5;    // 0 idle, 1 cooling, 2 heating
  uint32 flags = 6;     // bit0 paused, bit1 celsius, bit2 temp_valid
  uint32 day = 7;
  string batch = 8;     // <= 15 bytes UTF-8
  uint32 wanted = 9;    // what the control law asks for (0/1/2 as action); differs from action
                        // while the output guard holds it off (compressor delay, changeover)
  uint32 wait_s = 10;   // seconds until wanted may start, 0 = not waiting
}

// msg_type 4, controller -> display: what Settings › Heat / Cool show. On change, on a sync
// request and every few seconds (latest wins).
message Settings {
  uint32 heat_diff_cc = 1;       // heating starts this far below the setpoint
  uint32 cool_diff_cc = 2;       // cooling this far above it
  uint32 heat_delay_s = 3;       // restart delays
  uint32 cool_delay_s = 4;
  sint32 crash_default_cc = 5;   // where Cold crash starts
  uint32 profile = 6;            // 0 constant, 1 schedule
  uint32 step = 7;               // the running step, 255 = finished
  uint32 flags = 8;              // bit0 the dial overrides the step's target, bit1 simulated (demo)
  uint32 nsteps = 9;             // <= 8
  repeated sint32 step_temp_cc = 10;
  repeated uint32 step_ramp_h = 11;   // hours to ramp to the step's temperature (0 = jump)
  repeated uint32 step_hold_h = 12;   // hours to hold it
}

// msg_type 2, display -> controller. Idempotent.
message Command {
  uint32 kind = 1;      // 1 set_setpoint, 2 set_mode, 3 set_units, 4 request_sync,
                        // 5 start_day_count, 6 set_tuning, 7 set_profile, 8 set_step,
                        // 9 set_step_count, 10 set_clock
  uint32 mode = 2;
  sint32 setpoint_cc = 3;
  uint32 flags = 4;     // bit0 paused, bit1 celsius
  uint32 tuning = 5;    // set_tuning: 0 heat_diff, 1 cool_diff, 2 heat_delay, 3 cool_delay, 4 crash_default
  sint32 value = 6;     // set_tuning: centi-degC or seconds; set_profile; set_step_count;
                        // set_clock: Unix seconds (as uint32)
  uint32 step = 7;      // set_step: which step (temperature in setpoint_cc)
  uint32 ramp_h = 8;    // set_step
  uint32 hold_h = 9;    // set_step
}

// msg_type 3, controller -> display. A reset chunk starts a new series.
message HistoryChunk {
  uint32 flags = 1;                // bit0 reset, bit1 more chunks follow
  uint32 minutes_per_sample = 2;   // rounded; superseded by seconds_per_sample
  uint32 n = 3;
  repeated sint32 temps_cc = 4;    // <= 24 per chunk
  uint32 seconds_per_sample = 5;  // rounded; superseded by ms_per_sample
  uint32 ms_per_sample = 6;
}
